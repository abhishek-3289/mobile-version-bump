name: Bump app version

on:
  workflow_dispatch:
    inputs:
      increment-type:
        description: Part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Bump Android and iOS versions
        id: version
        uses: abhishek-3289/mobile-version-bump@v1
        with:
          increment-type: ${{ inputs.increment-type }}
          build-number-strategy: increment
          android-file: app/build.gradle.kts
          ios-file: ios/App.xcodeproj/project.pbxproj

      - name: Open pull request
        if: steps.version.outputs.changed-files != ''
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          CHANGED_FILES: ${{ steps.version.outputs.changed-files }}
          BASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="version/v$NEW_VERSION"
          read -r -a FILES <<< "$CHANGED_FILES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "${FILES[@]}"
          git commit -m "Bump version to $NEW_VERSION ($BUILD_NUMBER)"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Bump version to $NEW_VERSION" \
            --body "Automated version bump to \`$NEW_VERSION\` (build \`$BUILD_NUMBER\`). Merge, then tag the merge commit with \`v$NEW_VERSION\`."
